yolo_node:
  ros__parameters:
    # Full path to the exported model, e.g. /home/<user>/models/yolov8n.onnx
    model_path: ''
    # image_topic is picked by yolo_launch.py from the car profile
    # (car 1 webcam: /image_raw, car 2 RealSense: /camera/camera/color/image_raw)
    confidence: 0.35         # ignore boxes YOLO is less sure about than this
    iou: 0.45                # overlap above this = same object (NMS)
    input_size: 640          # must match imgsz used when exporting (try 320 if too slow)
    publish_debug_image: true
    classes: ['car']         # COCO class names to keep; ['all'] = everything
    barrier_color: orange    # barrier colour filter: orange or yellow
